{% extends 'base.html' %}
{% block content %}
    <input type="text" id="search-input" placeholder="Search repos by name">
    <div id="repo-list-container">
        <p>Loading repos...</p>
    </div>

{% endblock %}

{% block page_scripts %}
<script>
  const REPOS_LIST_ENDPOINT = "{{ url_for('list_repos') }}";

  function generateMakePrivateUrl(repoName) {
    return `{{ url_for('make_private', repo='${repoName}') | replace('%7B', '{') | replace('%7D', '}') }}`
  }

  function generateMakePublicUrl(repoName) {
    return `{{ url_for('make_public', repo='${repoName}') | replace('%7B', '{') | replace('%7D', '}') }}`
  }
</script>
<script src="{{ url_for('static', filename='js/repos.js') }}"></script>
{% endblock %}
