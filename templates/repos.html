{% extends 'base.html' %}
{% block content %}
    <div id="last-refreshed-info-container" class="">
        <span id="last-refreshed-text"></span>
        <span id="refresh-button" class="material-icons toggle-visibility-icon">refresh</span>
    </div>
    <div id="search-container">
        <input type="text" id="search-input" placeholder="Filter repos by name">
        <div id="visibility-filters">
            <div class="visibility-filter">
                <input type="checkbox" id="visibility-filter-public">
                <label for="visibility-filter-public">Public Only</label>
            </div>
            <div class="visibility-filter">
                <input type="checkbox" id="visibility-filter-private">
                <label for="visibility-filter-private">Private Only</label>
            </div>
        </div>
    </div>
    <div id="repo-list-container">
        <p>Loading repos...</p>
    </div>
    <div id="repo-info-container" class="hidden"></div>
{% endblock %}

{% block page_scripts %}
<script>
  const REPOS_LIST_ENDPOINT = "{{ url_for('list_repos') }}";

  function generateMakePrivateUrl(repoName) {
    return `{{ url_for('make_private', repo='${repoName}') | replace('%7B', '{') | replace('%7D', '}') }}`
  }

  function generateMakePublicUrl(repoName) {
    return `{{ url_for('make_public', repo='${repoName}') | replace('%7B', '{') | replace('%7D', '}') }}`
  }
</script>
<script src="{{ url_for('static', filename='js/repos.js') }}"></script>
{% endblock %}
